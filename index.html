<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Вся моя жизнь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar navigation + 12-column card grid; powder-pink calm surfaces, plum text */
:root{
  --bg:#FAF1F1; --surface:#FFFFFF; --soft:#F7E4E6; --line:#F0D9DD;
  --text:#3E2A31; --muted:#8C7279; --accent:#D88C9C; --accent-deep:#B65A71;
  --on-accent:#FFFFFF;
  --ok:#5E9F7E; --warn:#D49A3A; --crit:#C9566B;
  --a-day:#D88C9C; --a-work:#9B8EC9; --a-health:#7FA88E; --a-personal:#E3A07A;
  --a-growth:#79A9D1; --a-goals:#C9A040; --a-finance:#C27BA0;
  --hero-1:#F6D3DA; --hero-2:#FBE8E3; --hero-3:#EBD9F0;
  --shadow:0 14px 34px -22px rgba(182,90,113,.45);
  --overlay:rgba(62,42,49,.32);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1418; --surface:#281C22; --soft:#34242C; --line:#43303A;
  --text:#F6E7EB; --muted:#BFA3AC; --accent:#E4A1B0; --accent-deep:#F08FA7; --on-accent:#2A1A20;
  --ok:#7CC09B; --warn:#E6B45E; --crit:#EE8396;
  --a-day:#E4A1B0; --a-work:#B4A8E0; --a-health:#93C2A3; --a-personal:#F0B591;
  --a-growth:#93BFE3; --a-goals:#E0BC5E; --a-finance:#DB99BD;
  --hero-1:#4A2A36; --hero-2:#3A2530; --hero-3:#3A2A45;
  --shadow:0 14px 34px -22px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1418; --surface:#281C22; --soft:#34242C; --line:#43303A;
  --text:#F6E7EB; --muted:#BFA3AC; --accent:#E4A1B0; --accent-deep:#F08FA7; --on-accent:#2A1A20;
  --ok:#7CC09B; --warn:#E6B45E; --crit:#EE8396;
  --a-day:#E4A1B0; --a-work:#B4A8E0; --a-health:#93C2A3; --a-personal:#F0B591;
  --a-growth:#93BFE3; --a-goals:#E0BC5E; --a-finance:#DB99BD;
  --hero-1:#4A2A36; --hero-2:#3A2530; --hero-3:#3A2A45;
  --shadow:0 14px 34px -22px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.35rem,2.4vw,1.85rem)}
h2{font-size:1.02rem}
h3{font-size:.92rem}
p{margin:0}
:focus-visible{outline:2.5px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:var(--on-accent)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:.95rem;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.74rem}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;font-size:.92rem;border:0;background:none;width:100%;text-align:left}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--accent-deep)}
.nav a.on svg{color:var(--accent-deep)}
.nav svg{color:var(--muted)}
.nav .cnt{margin-left:auto;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.nav .cnt.crit{background:var(--crit)}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}
.save{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);padding:12px 12px 0}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.save.cloud .dot{background:var(--ok)}
.save.busy .dot{background:var(--accent)}

main{min-width:0;padding-block:26px 110px;padding-left:max(clamp(16px,3vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,36px),env(safe-area-inset-right,0px))}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--muted);margin-top:4px}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{display:flex;align-items:center;gap:9px}
.card-h h2 svg{color:var(--accent-deep)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.empty{color:var(--muted);font-size:.88rem;padding:14px;border:1.5px dashed var(--line);border-radius:14px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.stat .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .val{font-family:var(--f-display);font-size:1.45rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .sub{font-size:.8rem;color:var(--muted)}
.stat.ok .val{color:var(--ok)}.stat.warn .val{color:var(--warn)}.stat.crit .val{color:var(--crit)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:9px 15px;font-weight:700;font-size:.88rem;background:var(--accent-deep);color:var(--on-accent);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--soft);color:var(--accent-deep)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:var(--crit);color:#fff}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:10px}
.btn svg.i{width:17px;height:17px}
.ib{border:0;background:transparent;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--accent-deep)}
.ib svg.i{width:17px;height:17px}

/* Rows */
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px}
.row:hover{background:var(--soft)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.row-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.row:hover .row-acts,.row:focus-within .row-acts{opacity:1}
@media (hover:none){.row-acts{opacity:1}}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;color:transparent;flex:none;padding:0}
.chk svg.i{width:15px;height:15px;stroke-width:3}
.chk.on{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:10px 6px 2px}
.grp.crit{color:var(--crit)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip .dt{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.chip.area{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text)}
.chip.hi{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--text)}
.chip.od{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.chip.ev{background:color-mix(in srgb,var(--a-growth) 20%,transparent);color:var(--text)}
.chip.okc{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}

.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}

/* Hero */
.hero{border-radius:26px;padding:26px 28px;background:linear-gradient(120deg,var(--hero-1),var(--hero-2) 55%,var(--hero-3));border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.hero h1{font-size:clamp(1.4rem,3vw,2.1rem)}
.hero .date{color:var(--muted);font-weight:600;margin-top:6px;text-transform:capitalize}
.hero-ring{display:flex;align-items:center;gap:14px}
.hero-ring .t{font-size:.85rem;color:var(--muted);max-width:150px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--soft);border:1px dashed var(--accent);margin-bottom:16px;font-size:.88rem}

/* Overview */
.ov{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ov li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.ov li svg{color:var(--accent-deep);margin-top:1px}
.ai-box{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:.9rem}
.ai-box ul{margin:6px 0;padding-left:18px}
.ai-box p{margin:4px 0}
.ai-box h4{margin:8px 0 2px;font-family:var(--f-display);font-size:.82rem;font-weight:600}

.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}

/* Water, mood */
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:34px;height:42px;border:0;background:none;padding:0;color:var(--line)}
.glass svg{width:100%;height:100%}
.glass .w{fill:transparent;transition:fill .2s}
.glass.on .w{fill:var(--a-growth)}
.glass .o{fill:none;stroke:var(--accent);stroke-width:1.8}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--muted);min-width:58px;flex:1}
.mood svg{width:30px;height:30px}
.mood.on{border-color:var(--accent-deep);background:var(--soft);color:var(--accent-deep)}

/* Habits chips */
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;font-weight:600;font-size:.86rem}
.hchip.on{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
.hchip .st{display:flex;align-items:center;gap:2px;font-size:.75rem;opacity:.85}
.hchip .st svg.i{width:14px;height:14px}

/* Tracker */
.tracker{overflow-x:auto}
.tracker table{border-collapse:separate;border-spacing:4px;width:100%;min-width:620px}
.tracker th{font-size:.68rem;color:var(--muted);font-weight:700;text-align:center}
.tracker th.n{text-align:left}
.tracker td.n{font-weight:600;font-size:.88rem;min-width:170px}
.tracker td.n .hn{display:flex;align-items:center;gap:8px}
.cell{width:100%;min-width:26px;height:28px;border-radius:8px;border:0;background:var(--soft);padding:0}
.cell.on{background:var(--accent-deep)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}

/* Goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.goal-top{display:flex;gap:14px;align-items:flex-start}
.goal-top .gt{flex:1;min-width:0}
.goal-top h3{font-size:1rem;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;font-size:.88rem;padding:4px 2px}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step .chk{width:20px;height:20px;border-radius:6px}
.tabs{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:10px;font-weight:700;font-size:.86rem;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-head h2{text-transform:capitalize;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:92px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.45}
.day.sel{border-color:var(--accent-deep);box-shadow:0 0 0 2px var(--accent) inset}
.day .dn{font-weight:700;font-size:.8rem}
.day.today .dn{background:var(--accent-deep);color:var(--on-accent);border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.ev-mini{font-size:.68rem;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev-mini i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c)}
.ev-mini.dn2{text-decoration:line-through;color:var(--muted)}
.more{font-size:.66rem;color:var(--muted);font-weight:700}

/* Awards */
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.medal{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--surface)}
.medal .m{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a-goals),var(--accent-deep));color:#fff}
.medal .m svg.i{width:26px;height:26px}
.medal.off .m{background:var(--soft);color:var(--muted)}
.medal b{font-size:.86rem}
.medal small{font-size:.74rem;color:var(--muted);line-height:1.3}
.medal .bar{width:100%;height:6px}

/* Finance */
.legend{display:flex;flex-direction:column;gap:7px;font-size:.86rem;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.legend span{flex:1;min-width:0}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.inc{color:var(--ok)}

/* Gratitude */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note p{font-size:.9rem;overflow-wrap:anywhere}
.note .nf{display:flex;align-items:center;justify-content:space-between;gap:6px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.chart .vl{fill:var(--text);font-size:13px;font-weight:700;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent-deep);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--surface);stroke:var(--accent-deep);stroke-width:2.5}
.chart .pt.last{fill:var(--accent-deep)}
.ring .bg{stroke:var(--soft)}
.ring .tx{fill:var(--text);font-family:var(--f-display);font-weight:600}
.ring .sx{fill:var(--muted);font-family:var(--f-body);font-weight:600}

/* Forms */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:700;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icons button.on{border-color:var(--accent-deep);color:var(--accent-deep);background:var(--soft)}
.err{color:var(--crit);font-size:.82rem;font-weight:600}

/* Modal */
.ov-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:22px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* AI panel */
.fab{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 14px 30px -10px rgba(182,90,113,.6);border-radius:99px;padding:12px 18px}
.ai{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;box-shadow:-20px 0 50px -30px rgba(0,0,0,.4);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.ai.open{transform:none}
.ai-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.ai-h h2{display:flex;align-items:center;gap:8px}
.ai-h h2 svg{color:var(--accent-deep)}
.ai-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;font-size:.9rem;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-deep);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg.a ul{margin:4px 0;padding-left:18px}.msg.a p{margin:3px 0}
.msg.a h4{margin:6px 0 2px;font-size:.84rem}
.msg.e{align-self:stretch;background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--text);font-size:.85rem}
.msg .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.sugg button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:600;color:var(--accent-deep)}
.sugg button:hover{background:var(--soft)}
.ai-f{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.ai-f textarea{min-height:44px;max-height:140px;resize:none}
.typing{color:var(--muted);font-style:italic}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:80;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40}

/* Responsive */
@media (max-width:1200px){.s3{grid-column:span 6}.s4{grid-column:span 6}.s5,.s7{grid-column:span 12}.s8{grid-column:span 12}}
@media (max-width:1200px) and (min-width:861px){.s4.keep{grid-column:span 4}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:45;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0;margin:-14px 0 12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  main{padding-top:14px}
  .s3,.s4,.s5,.s6,.s7,.s8,.s4.keep{grid-column:span 12}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hero{padding:20px}
}
@media (max-width:460px){
  .fgrid{grid-template-columns:1fr}
  .day{min-height:52px;padding:4px}
  .ev-mini{display:none}
  .day .dots{display:flex;gap:2px;flex-wrap:wrap}
  .stat .val{font-size:1.15rem}
  .fab span{display:none}
  .fab{padding:14px}
}
.day .dots{display:none}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))]);

let modalClose = null;
function openModal(html, onMount) {
  const root = $("#modalRoot"), prev = document.activeElement;
  root.innerHTML = `<div class="ov-bg" id="ovBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;

  modalClose = close;

}

function field(f, v) {

  return `<label class="f${full}" for="${id}">${f.label}<input type="${f.type || "text"}" id="${id}" name="${f.k}" value="${esc(val)}" ${f.step ? `step="${f.step}"` : ""} ${f.min != null ? `min="${f.min}"` : ""} placeholder="${esc(f.ph || "")}" autocomplete="off"></label>`;

    (root, close) => {

/* ---------- Markdown (tiny, escaped) ---------- */
function md(t) {
  const lines = esc(t).split("\n"); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (!l.trim()) continue;
    const h = l.match(/^#{1,4}\s+(.*)/); out += h ? `<h4>${h[1]}</h4>` : `<p>${l}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

function buildContext() {
  const T = TODAY(), L = [];
  L.push(`Сегодня: ${WD[parse(T).getDay()]}, ${fmtDate(T)} ${T.slice(0, 4)} (${T}), сейчас ${nowHM()}. Имя: ${S.name || "не указано"}.`);

    const k = addDays(T, i), its = itemsOn(k);
    L.push(`${k} (${WD[parse(k).getDay()]}): ${its.length ? "" : "пусто"}`);
    its.forEach(it => L.push(`  - [${it.done ? "x" : " "}] ${it.time || "без времени"} ${it.title} (${AREAS[it.area]?.n || it.area}${it.kind === "event" ? ", событие" : ""}${it.priority === "high" ? ", важно" : ""})`));

  const od = overdue(); L.push(`\nПРОСРОЧЕНО (${od.length}): ` + (od.map(i => `${i.title} (с ${i.date}, ${AREAS[i.area]?.n})`).join("; ") || "нет"));
  L.push(`\nПРИВЫЧКИ (за неделю ${habitWeekPct()}%):`);
  S.habits.forEach(h => L.push(`  - ${h.name}: серия ${streak(h)} дн., неделя ${habitWeekPct([h])}%, сегодня ${h.log[T] ? "отмечено" : "не отмечено"}`));
  L.push("\nЦЕЛИ И МЕЧТЫ:");
  S.goals.forEach(g => { const nx = g.steps.find(s => !s.done); L.push(`  - ${g.type === "dream" ? "Мечта" : "Цель"}: ${g.title} (${AREAS[g.area]?.n}${g.deadline ? ", срок " + g.deadline : ""}) — ${goalPct(g)}%, следующий шаг: ${nx ? nx.t : "все шаги выполнены или их нет"}`); });
  const h = S.health, days = last7(), sl = days.map(k => h.sleep[k]).filter(v => v != null);
  const wk = h.workouts.filter(w => w.date > addDays(T, -7) && w.date <= T);
  const ws = [...h.weight].sort((a, b) => a.date.localeCompare(b.date));
  L.push(`\nЗДОРОВЬЕ: вода сегодня ${waterToday()}/${h.waterGoal} стаканов; сон сегодня ${h.sleep[T] ?? "не отмечен"} ч, средний за неделю ${sl.length ? (sl.reduce((a, b) => a + b, 0) / sl.length).toFixed(1) : "нет данных"} ч; тренировок за 7 дней ${wk.length} (${wk.reduce((a, w) => a + Number(w.min), 0)} мин): ${wk.map(w => w.type).join(", ") || "нет"}; вес ${ws.length ? ws[ws.length - 1].kg + " кг" : "нет данных"}.`);
  const md7 = days.map(k => S.mood[k]).filter(Boolean);
  L.push(`НАСТРОЕНИЕ: сегодня ${S.mood[T] ? MOODS[S.mood[T] - 1] : "не отмечено"}; среднее за неделю ${md7.length ? (md7.reduce((a, b) => a + b, 0) / md7.length).toFixed(1) : "—"} из 5.`);
  const f = monthFin(monthKey(T)), byCat = {}; f.ops.filter(o => o.type === "expense").forEach(o => byCat[o.cat] = (byCat[o.cat] || 0) + Number(o.amount));
  L.push(`ФИНАНСЫ МЕСЯЦА: доходы ${fmtMoney(f.inc)}, расходы ${fmtMoney(f.exp)}, лимит ${fmtMoney(S.budget)}, остаток лимита ${fmtMoney(S.budget - f.exp)}; по категориям: ${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${c} ${fmtMoney(v)}`).join(", ") || "нет расходов"}.`);
  return L.join("\n");
}

async function sendAI(text) {
  if (ui.aiBusy) return;
  chat.push({ role: "user", content: text });
  const a = { role: "assistant", content: "", acts: [] }; chat.push(a); curAssistant = a;
  ui.aiBusy = true; renderChat();
  aiCtl = new AbortController();
  try {
    const sample = await getSample();
    if (!sample) throw { code: "no_sample" };
    let canTools = false; try { canTools = !!(await sample.limits()).tools; } catch {}
    const rules = `Ты — ИИ-помощник в личном приложении «Вся моя жизнь». Отвечай по-русски, тепло, на «ты», коротко и списками. Опирайся только на данные ниже, не выдумывай задачи и цифры.${canTools ? " Если просят добавить дело — вызови add_task (дата в формате YYYY-MM-DD, «завтра», «в пятницу» переводи в дату относительно сегодняшней). Если просят отметить выполненным — вызови complete_task. После действия коротко подтверди." : " Добавлять и отмечать задачи сейчас нельзя: если просят, предложи сделать это вручную."}\n\nДАННЫЕ ПОЛЬЗОВАТЕЛЬНИЦЫ:\n${buildContext()}`;
    const turns = chat.filter(m => (m.role === "user" || m.role === "assistant") && m.content && m !== a).slice(-12);
    while (turns.length && turns[0].role !== "user") turns.shift();
    const input = [{ role: "user", content: rules }, ...turns.map(m => ({ role: m.role, content: m.content }))];
    const opts = { signal: aiCtl.signal, onText: ({ text }) => { a.content = text; const el = $("#m" + chat.indexOf(a)); if (el) { el.innerHTML = md(text) + (a.acts.length ? `<div class="acts">${a.acts.map(x => `<span class="chip okc">${esc(x)}</span>`).join("")}</div>` : ""); $("#aiMsgs").scrollTop = 1e9; } } };
    if (canTools) opts.tools = aiTools(); else opts.cache = false;
    const res = await sample(input, opts);
    a.content = res.text;
  } catch (e) {
    if (e && e.text) a.content = e.text;
    if (!a.content) chat.splice(chat.indexOf(a), 1);
    if (!(e && e.code === "cancelled")) chat.push({ role: "error", content: aiErr(e) });
  }
  ui.aiBusy = false; curAssistant = null; aiCtl = null; renderChat();
}

/* ---------- Boot ---------- */
render();
setSave("local");
initCloud();
// Refresh "today" when the date changes while the app stays open
let lastDay = TODAY();
setInterval(() => { if (TODAY() !== lastDay) { lastDay = TODAY(); ui.calSel = lastDay; render(); } }, 60000);
})();
